<!DOCTYPE html>

<head>

<title>C# – نموونەکانی Visual Programming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab{padding:12px 22px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;transition:all .3s;backdrop-filter:blur(10px)}
.tab:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.tab.active{background:#fff;color:#667eea;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.content{display:none}.content.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.example{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example-title{flex:1;background:linear-gradient(135deg,#e0f2fe,#bae6fd);padding:14px 18px;border-radius:8px;font-size:17px;font-weight:bold;color:#0c4a6e}
.pdf-page{background:#f97316;color:#fff;font-size:11px;font-weight:bold;padding:5px 11px;border-radius:20px;white-space:nowrap;direction:ltr;box-shadow:0 2px 6px rgba(249,115,22,.35)}
.code-box{background:#1e1e1e;border-radius:10px;margin-bottom:18px;overflow:hidden;border:1px solid #333;display:flex;direction:ltr}
.line-numbers{background:#2d2d2d;border-left:4px solid #5cb85c;padding:18px 0;min-width:42px;text-align:center;font-family:Consolas,Monaco,monospace;font-size:15px;color:#858585;line-height:1.7;user-select:none;flex-shrink:0}
.line-numbers span{display:block;padding:0 8px}
.code-content{padding:18px 20px;overflow-x:auto;flex:1}
.code-content pre{font-family:Consolas,Monaco,monospace;line-height:1.7;white-space:pre;color:#e2e8f0;font-size:15px;text-align:left}
.kw{color:#d4a574;font-weight:700}.dt{color:#bb86fc;font-weight:700}.con{color:#4fc3f7;font-weight:600}.num{color:#b5cea8}.str{color:#ce9178}.cmt{color:#6a9955;font-style:italic}
.output-box{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #3b82f6;border-radius:8px;padding:14px 18px;margin-bottom:18px;direction:ltr;overflow-x:auto}
.output-header{font-weight:bold;color:#1e40af;margin-bottom:8px;font-size:15px}
.output-content{color:#1e3a8a;font-family:Consolas,monospace;font-size:14px;line-height:1.8;white-space:pre;text-align:left}
.expl-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-right:6px solid #22c55e;border-radius:14px;padding:22px 24px}
.expl-title{font-weight:800;color:#166534;margin-bottom:14px;font-size:16px;border-bottom:2px dashed #86efac;padding-bottom:10px}
.expl-box ul{list-style:none}
.expl-box li{margin-bottom:11px;line-height:2;font-size:15px;color:#1c1917;padding:10px 14px;background:#fff;border-radius:9px;border-right:4px solid #22c55e;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rng{flex-shrink:0;min-width:36px;height:24px;line-height:22px;text-align:center;background:#dcfce7;color:#166534;font-weight:800;border:1.5px solid #22c55e;border-radius:5px;padding:0 6px;font-size:13px;margin-top:6px}.sn{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:middle}.sn.sm{font-size:10px}
.ln{background:#22c55e;color:#fff;font-weight:700;font-size:13px;padding:0 10px;border-radius:20px;height:26px;line-height:26px;flex-shrink:0;margin-top:5px;direction:ltr}
.expl-box b{color:#0369a1;background:#dbeafe;padding:1px 7px;border-radius:5px;direction:ltr;display:inline-block;font-family:Consolas,monospace;font-size:13px}
.expl-box code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.intro{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.intro h2{color:#667eea;margin-bottom:18px;font-size:1.9em}.intro p{color:#4b5563;line-height:1.8;margin-bottom:12px}
.fb-box{margin-top:26px;padding:22px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;text-align:right}
.fb-title{font-weight:800;color:#5b21b6;font-size:17px;margin-bottom:6px}
.fb-sub{color:#6b5b95;font-size:13.5px;margin-bottom:14px;line-height:1.8}
.fb-quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fb-qbtn{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd6fe;background:#fff;border-radius:10px;color:#5b21b6;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.2s}
.fb-qbtn:hover{background:#ede9fe;border-color:#a78bfa}
.fb-overlay{display:none;position:fixed;inset:0;background:rgba(17,12,34,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.fb-overlay.open{display:flex}
.fb-dialog{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.fb-dialog h3{color:#5b21b6;font-size:17px;margin-bottom:14px}
.fb-dialog .fb-qbtn{width:100%;margin-bottom:10px;text-align:center}
.fb-dialog-cancel{width:100%;padding:10px;border:none;background:#f3f4f6;color:#4b5563;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.fb-area{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid #ddd6fe;border-radius:10px;font-family:inherit;font-size:14.5px;resize:vertical;color:#1c1917;box-sizing:border-box;margin-bottom:12px}
.fb-area:focus{outline:none;border-color:#7c3aed}
.fb-send{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.fb-send:hover{filter:brightness(1.07)}
.fb-send:disabled{opacity:.6;cursor:default}
.fb-send2{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.3);margin-top:10px}
.fb-msg{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;border-radius:8px;padding:9px;display:none}
.fb-msg.ok{display:block;background:#dcfce7;color:#166534}
.fb-msg.err{display:block;background:#fee2e2;color:#991b1b}
.expl-box li{flex-direction:column;align-items:flex-start;gap:6px}
.expl-box li>span:last-child{width:100%}
.expl-box .rng{min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px;margin-top:0}
.expl-box .sn{display:block;width:fit-content;max-width:100%;margin-bottom:6px;white-space:pre;text-align:left}
.expl-box .sn{overflow:visible;overflow-x:visible;white-space:normal;overflow-wrap:anywhere}
.sn.xs{font-size:8px}
.cls{color:#4ec9b0}.fn{color:#dcdcaa}.var{color:#9cdcfe}.op{color:#ff79c6}
.more-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
.more-panel{display:none;margin-top:14px;background:#f5f3ff;border:1.5px solid #c4b5fd;border-right:6px solid #7c3aed;border-radius:14px;padding:20px}
.more-panel.open{display:block;animation:fadeIn .4s}
.more-title{font-weight:800;color:#5b21b6;font-size:16px;margin-bottom:10px}
.more-intro,.more-sum{line-height:2;color:#1c1917;font-size:15px;margin-bottom:14px}
.more-panel code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.st{background:#fff;border:1.5px solid #ddd6fe;border-right:5px solid #7c3aed;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.st-h{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:8px}
.st-h .rng{margin-top:0;min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px}
.st-h .sn{white-space:normal;overflow:visible;overflow-wrap:anywhere;background:#dbeafe;color:#0369a1;padding:1px 7px;border-radius:5px}
.st p{line-height:2;font-size:15px;color:#1c1917;margin-bottom:8px}
.st-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#6b7280}
.vs{font-style:normal;background:#ede9fe;color:#4c1d95;border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;direction:ltr;font-size:13px;font-weight:700}
.st-l{font-weight:800;color:#5b21b6;font-size:13px;margin-bottom:2px}
.pts{margin:8px 0 6px;padding:8px 10px;background:#faf5ff;border:1px dashed #c4b5fd;border-radius:8px}
.pts-t{font-weight:800;color:#5b21b6;font-size:13px;margin-bottom:6px}
.pt{display:flex;gap:8px;align-items:flex-start;margin-bottom:5px;font-size:14px;line-height:1.9;color:#1c1917}
.ptk{flex-shrink:0;direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:12px;background:#1e1e1e;color:#ce9178;padding:0 7px;border-radius:4px;margin-top:3px}
.st p{font-size:16px;line-height:2.1}
.st.skip{opacity:.6;border-style:dashed;background:#f9fafb}
.st.br{padding:8px 12px;background:#faf5ff}
.st.br p{font-size:13px;margin:0;color:#6b7280}
.tg{margin-inline-start:auto;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:#e5e7eb;color:#4b5563;white-space:nowrap}
.tg.ok{background:#dcfce7;color:#166534}
.lb{font-size:12px;font-weight:800;color:#7c3aed;margin-bottom:2px}
.more-legend{font-size:13px;color:#4b5563;margin-bottom:14px;line-height:2.2}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#1fa855}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#dc2626}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
.output-box{padding:7px 12px;border-width:1.5px;border-radius:6px;margin-bottom:12px}
.output-header{font-size:12px;margin-bottom:3px}
.output-content{font-size:11px;line-height:1.5}
.pin-fab{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
.pin-fab svg{transition:transform .2s}
.pin-wrap.full .pin-fab{border:4px solid #7c3aed}
.pin2.full .pin-fab{border-color:#dc2626}
.pin-wrap.full svg{transform:rotate(45deg)}
.pin-wrap.dock{left:0}
.pin-wrap.dock .pin-fab{opacity:.45;transform:translateX(-32px)}
.pin-wrap.dock .pin-pill{opacity:0;pointer-events:none}
.pin-fab{transition:transform .2s ease,background .2s,opacity .2s}
.pin-fab{touch-action:none;transition:transform .2s ease,background .2s}
.pin-fab.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin-pill{transition:background .15s,color .15s}
.pin-pill.hint{background:#7c3aed;color:#fff}.pin2 .pin-pill.hint{background:#dc2626}
</style>
</head>

<script>
const E=[{"t":"Math Table: Abs(x) – بەهای ڕەها","p":"PDF P.34","c":"// بەهای ڕەهای ژمارەیەک دەدۆزێتەوە (نیشانەی - لادەبات)\nMath.Abs(23.7);\nMath.Abs(0.0);\nMath.Abs(-23.7);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Ceiling(x) – بەرزکردنەوە بۆ ژمارەی تەواو","p":"PDF P.34","c":"// ژمارەیەک بۆ نزیکترین ژمارەی تەواوی گەورەتر بەرز دەکاتەوە\nMath.Ceiling(9.2);\nMath.Ceiling(-9.8);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Cos(x) – کۆسینۆس","p":"PDF P.34","c":"// کۆسینۆسی گۆشەیەک دەدۆزێتەوە (گۆشە بە ڕادیان)\nMath.Cos(0.0);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Exp(x) – توانی e","p":"PDF P.34","c":"// e بە توانی ژمارەیەک دەدۆزێتەوە (e نزیکەی 2.71828ـە)\nMath.Exp(1.0);\nMath.Exp(2.0);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Floor(x) – نزمکردنەوە بۆ ژمارەی تەواو","p":"PDF P.34","c":"// ژمارەیەک بۆ نزیکترین ژمارەی تەواوی بچووکتر نزم دەکاتەوە\nMath.Floor(9.2);\nMath.Floor(-9.8);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Log(x) – لۆگارتمی سروشتی","p":"PDF P.34","c":"// لۆگارتمی سروشتی (بنەما e) دەدۆزێتەوە\nMath.Log(Math.E);\nMath.Log(Math.E * Math.E);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Max(x, y) – گەورەتر","p":"PDF P.34","c":"// گەورەتر لە نێوان دوو ژمارە دەدۆزێتەوە\nMath.Max(2.3, 12.7);\nMath.Max(-2.3, -12.7);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Min(x, y) – بچووکتر","p":"PDF P.34","c":"// بچووکتر لە نێوان دوو ژمارە دەدۆزێتەوە\nMath.Min(2.3, 12.7);\nMath.Min(-2.3, -12.7);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Pow(x, y) – توان","p":"PDF P.34","c":"// ژمارەیەک بە توانی ژمارەیەکی تر دەدۆزێتەوە\nMath.Pow(2.0, 7.0);\nMath.Pow(9.0, 0.5);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Sin(x) – ساین","p":"PDF P.34","c":"// ساینی گۆشەیەک دەدۆزێتەوە (گۆشە بە ڕادیان)\nMath.Sin(0.0);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Sqrt(x) – ڕەگی دووجا","p":"PDF P.34","c":"// ڕەگی دووجای ژمارەیەک دەدۆزێتەوە\nMath.Sqrt(900.0);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math Table: Tan(x) – تانجێنت","p":"PDF P.34","c":"// تانجێنتی گۆشەیەک دەدۆزێتەوە (گۆشە بە ڕادیان)\nMath.Tan(0.0);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math.Max(x,y) – دۆزینەوەی گەورەترین بەها","p":"PDF P.35","c":"// Math.Max گەورەترین بەها لە نێوان دوو ژمارە دەدۆزێتەوە\nConsole.WriteLine(Math.Max(5, 10));","o":"10"},{"t":"Math.Min(x,y) – دۆزینەوەی کەمترین بەها","p":"PDF P.35","c":"// Math.Min کەمترین بەها لە نێوان دوو ژمارە دەدۆزێتەوە\nMath.Min(5, 10);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Math.Sqrt(x) – دۆزینەوەی ڕەگی دووجا","p":"PDF P.35","c":"// Math.Sqrt ڕەگی دووجای ژمارەیەک دەدۆزێتەوە\nMath.Sqrt(64);","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Create a Method – دروستکردنی میسۆد","p":"PDF P.36","c":"static void MyMethod()\n{\n  // کۆدی ئەو کارەی دەتەوێت لێرە دەنووسرێت\n}","o":"(No output)\n-- میسۆدەکە تەنها دروست کراوە و بانگ نەکراوە، بۆیە هیچ نیشان نادرێت"},{"t":"Call a Method – بانگکردنی میسۆد","p":"PDF P.37","c":"static void MyMethod()\n{\n  Console.WriteLine(\"I just got executed!\");\n}\n\nMyMethod();\n// دەرەنجام: I just got executed!","o":"I just got executed!"},{"t":"Call a Method Multiple Times – بانگکردنی میسۆد چەند جارێک","p":"PDF P.37","c":"static void MyMethod()\n{\n  Console.WriteLine(\"I just got executed!\");\n}\n\n// میسۆدەکە چەند جارێک دەتوانرێت بانگ بکرێت\nMyMethod();\nMyMethod();\nMyMethod();","o":"I just got executed!\nI just got executed!\nI just got executed!"},{"t":"Method Parameters – پارامیتەری میسۆد","p":"PDF P.38","c":"static void MyMethod(string fname)\n{\n  Console.WriteLine(fname + \" Refsnes\");\n}\n\nMyMethod(\"Liam\");\nMyMethod(\"Jenny\");\nMyMethod(\"Anja\");\n// دەرەنجام: Liam Refsnes\n// دەرەنجام: Jenny Refsnes\n// دەرەنجام: Anja Refsnes","o":"Liam Refsnes\nJenny Refsnes\nAnja Refsnes"},{"t":"Multiple Parameters – چەند پارامیتەرێک","p":"PDF P.39","c":"static void MyMethod(string fname, int age)\n{\n  Console.WriteLine(fname + \" is \" + age);\n}\n\nMyMethod(\"Liam\", 5);\nMyMethod(\"Jenny\", 8);\nMyMethod(\"Anja\", 31);\n// دەرەنجام: Liam is 5\n// دەرەنجام: Jenny is 8\n// دەرەنجام: Anja is 31","o":"Liam is 5\nJenny is 8\nAnja is 31"},{"t":"Return Values – گەڕاندنەوەی بەها","p":"PDF P.39-40","c":"static int MyMethod(int x)\n{\n  return 5 + x;\n}\n\nConsole.WriteLine(MyMethod(3));\n// دەرەنجام 8 (5 + 3)","o":"8"},{"t":"Return Sum of Two Parameters – گەڕاندنەوەی کۆی دوو پارامیتەر","p":"PDF P.40","c":"static int MyMethod(int x, int y)\n{\n  return x + y;\n}\n\nConsole.WriteLine(MyMethod(5, 3));\n// دەرەنجام 8 (5 + 3)","o":"8"},{"t":"Store the Result in a Variable – هەڵگرتنی ئەنجام لە گۆڕاو","p":"PDF P.40","c":"static int MyMethod(int x, int y)\n{\n  return x + y;\n}\n\nint z = MyMethod(5, 3);\nConsole.WriteLine(z);\n// دەرەنجام 8 (5 + 3)","o":"8"},{"t":"Declare an Array – ڕاگەیاندنی ئارە","p":"PDF P.41","c":"string[] cars;","o":"(No output)\n-- تەنها گۆڕاوەکە ڕادەگەیەنرێت و چاپکردنی تێدا نییە"},{"t":"Array Literal – دانانی بەها لە ئارە","p":"PDF P.41","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};","o":"(No output)\n-- تەنها ئارەکە دروست دەکرێت و چاپکردنی تێدا نییە"},{"t":"Array of Integers – ئارەی ژمارە","p":"PDF P.41","c":"int[] myNum = {10, 20, 30, 40};","o":"(No output)\n-- تەنها ئارەکە دروست دەکرێت و چاپکردنی تێدا نییە"},{"t":"Access the Elements of an Array – گەیشتن بە ئەندامی ئارەی","p":"PDF P.42","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nConsole.WriteLine(cars[0]);\n// دەرەنجام: Volvo","o":"Volvo"},{"t":"Change an Array Element – گۆڕینی ئەندامێکی ئارەی","p":"PDF P.42","c":"// بەهای ئەندامی یەکەم دەگۆڕێت\ncars[0] = \"Opel\";","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Change an Element and Print It – گۆڕین و چاپکردنی ئەندام","p":"PDF P.42-43","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\ncars[0] = \"Opel\";\nConsole.WriteLine(cars[0]);","o":"Opel"},{"t":"Array Length – درێژی ئارەی","p":"PDF P.43","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nConsole.WriteLine(cars.Length);\n// دەرەنجام: 4","o":"4"},{"t":"Loop Through an Array – for لەگەڵ ئارەی","p":"PDF P.43","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nfor (int i = 0; i < cars.Length; i++)\n{\n    Console.WriteLine(cars[i]);\n}","o":"Volvo\nBMW\nFord\nMazda"},{"t":"The foreach Loop (Example 1) – لووپی foreach","p":"PDF P.44","c":"string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nforeach (string i in cars)\n{\n    Console.WriteLine(i);\n}","o":"Volvo\nBMW\nFord\nMazda"},{"t":"The foreach Loop (Example 2) – کۆکردنەوەی ئەندامەکان","p":"PDF P.45","c":"int[] array = { 87, 68, 94, 100, 83, 78, 85, 91, 76, 87 };\nint total = 0;\n// بەهای هەر ئەندامێک دەخاتە سەر total\nforeach ( int number in array )\n  total += number;\nConsole.WriteLine( \"Total of array elements: {0}\", total );","o":"Total of array elements: 849"},{"t":"Sort Arrays – ڕیزکردنی ئارە","p":"PDF P.46","c":"// ڕیزکردنی دەق\nstring[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\nArray.Sort(cars);\nforeach (string i in cars)\n{\n  Console.WriteLine(i);\n}\n// ڕیزکردنی ژمارە\nint[] myNumbers = {5, 1, 8, 9};\nArray.Sort(myNumbers);\nforeach (int i in myNumbers)\n{\n  Console.WriteLine(i);\n}","o":"BMW\nFord\nMazda\nVolvo\n1\n5\n8\n9"},{"t":"System.Linq: Max, Min, Sum – میسۆدە زیادەکانی ئارەی","p":"PDF P.46-47","c":"using System.Linq;\nint[] myNumbers = {5, 1, 8, 9};\nConsole.WriteLine(myNumbers.Max());   // گەورەترین بەها دەگەڕێنێتەوە\nConsole.WriteLine(myNumbers.Min());   // کەمترین بەها دەگەڕێنێتەوە\nConsole.WriteLine(myNumbers.Sum());   // کۆی ئەندامەکان دەگەڕێنێتەوە","o":"9\n1\n23"},{"t":"Other Ways to Create an Array – شێوازەکانی تری دروستکردنی ئارەی","p":"PDF P.47","c":"// ئارەیەک بە چوار ئەندام دروست دەکات و بەهاکان دواتر دادەنرێن\nstring[] cars = new string[4];\n// ئارەیەک بە چوار ئەندام دروست دەکات و بەهاکان یەکسەر دادەنرێن\nstring[] cars = new string[4] {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\n// ئارەیەک بەبێ دیاریکردنی قەبارە دروست دەکات\nstring[] cars = new string[] {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};\n// ئارەیەک بەبێ وشەی new و بەبێ دیاریکردنی قەبارە دروست دەکات\nstring[] cars = {\"Volvo\", \"BMW\", \"Ford\", \"Mazda\"};","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"An Example of Array – نموونەی ئارەی لەگەڵ ڕێکخستنی دەرەنجام","p":"PDF P.48","c":"// لیستی دەستپێک بەهای هەر ئەندامێک دیاری دەکات\nint[] array = { 32, 27, 64, 18, 95, 14, 90, 70, 60, 37 };\nConsole.WriteLine( \"{0}{1,8}\", \"Index\", \"Value\" ); // سەردێڕەکان\n// بەهای هەر ئەندامێک چاپ دەکات\nfor ( int counter = 0; counter < array.Length; counter++ )\n  Console.WriteLine( \"{0,5}{1,8}\", counter, array[ counter ] );","o":"Index   Value\n    0      32\n    1      27\n    2      64\n    3      18\n    4      95\n    5      14\n    6      90\n    7      70\n    8      60\n    9      37"},{"t":"Another Example – کۆکردنەوەی ئارەی بە for","p":"PDF P.48","c":"int[] array = { 87, 68, 94, 100, 83, 78, 85, 91, 76, 87 };\nint total = 0;\n// بەهای هەر ئەندامێک دەخاتە سەر total\nfor ( int counter = 0; counter < array.Length; counter++ )\n  total += array[ counter ];\nConsole.WriteLine( \"Total of array elements: {0}\", total );","o":"Total of array elements: 849"},{"t":"C# Strings – دەق (string)","p":"PDF P.49","c":"// گۆڕاوێکی دەق دروست دەکەین و بەهایەکی دەدەینێ\nstring greeting = \"Hello\";","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"String Length – درێژی دەق","p":"PDF P.49","c":"string txt = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\nConsole.WriteLine(\"The length of the txt string is: \" + txt.Length);","o":"The length of the txt string is: 26"},{"t":"ToUpper() & ToLower() – گۆڕینی پیتەکان","p":"PDF P.50","c":"string txt = \"Hello World\";\nConsole.WriteLine(txt.ToUpper());   // دەرەنجام: \"HELLO WORLD\"\nConsole.WriteLine(txt.ToLower());   // دەرەنجام: \"hello world\"","o":"HELLO WORLD\nhello world"},{"t":"String Concatenation (+) – لکاندنی دەق بە +","p":"PDF P.50","c":"string firstName = \"John \";\nstring lastName = \"Doe\";\nstring name = firstName + lastName;\nConsole.WriteLine(name);","o":"John Doe"},{"t":"string.Concat() – لکاندنی دەق بە Concat","p":"PDF P.50","c":"string firstName = \"John \";\nstring lastName = \"Doe\";\nstring name = string.Concat(firstName, lastName);\nConsole.WriteLine(name);","o":"John Doe"},{"t":"Access Strings [0] – گەیشتن بە پیتێکی دەق","p":"PDF P.51","c":"string myString = \"Hello\";\nConsole.WriteLine(myString[0]);   // دەرەنجام: \"H\"","o":"H"},{"t":"Access Strings [1] – پیتی دووەم","p":"PDF P.51","c":"string myString = \"Hello\";\nConsole.WriteLine(myString[1]);   // دەرەنجام: \"e\"","o":"e"},{"t":"IndexOf() – دۆزینەوەی شوێنی پیت","p":"PDF P.51","c":"string myString = \"Hello\";\nConsole.WriteLine(myString.IndexOf(\"e\"));   // دەرەنجام: \"1\"","o":"1"},{"t":"Substring() – بڕینی بەشێک لە دەق","p":"PDF P.52","c":"// ناوی تەواو\nstring name = \"Waleed Kareem\";\n// شوێنی پیتی K\nint charPos = name.IndexOf(\"K\");\n// وەرگرتنی ناوی کۆتایی\nstring lastName = name.Substring(charPos);\n// چاپکردنی ئەنجامەکە\nConsole.WriteLine(lastName);","o":"Kareem"},{"t":"Special Characters (Error) – هەڵەی دوو کەوانە لە ناو دەق","p":"PDF P.52","c":"// هەڵە: دوو کەوانەی ناو دەقەکە دەقەکە دەبڕن\nstring txt = \"We are the so-called \"Vikings\" from the north.\";","o":"(No output)\n-- کۆدەکە هەڵەی کۆمپایلی هەیە و جێبەجێ ناکرێت"},{"t":"Escape \\\" – نووسینی دوو کەوانە لە ناو دەق","p":"PDF P.53","c":"// \\\" دوو کەوانە دەخاتە ناو دەقەکە\nstring txt = \"We are the so-called \\\"Vikings\\\" from the north.\";","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Escape \\' – نووسینی کەوانەی تاک","p":"PDF P.53","c":"string txt = \"It\\'s alright.\"; // دەرەنجام: It's alright","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Escape \\\\ – نووسینی هێڵی لار (backslash)","p":"PDF P.54","c":"string txt = \"The character \\\\ is called backslash.\";","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Other Escape Characters – نیشانە تایبەتییەکانی تر","p":"PDF P.54","c":"\\n\n\\t\n\\b","o":"(No output)\n-- ئەمانە تەنها نیشانەکانن و دەبێت لە ناو دەقێکدا بنووسرێن"},{"t":"Adding Numbers – کۆکردنەوەی ژمارە","p":"PDF P.55","c":"int x = 10;\nint y = 20;\nint z = x + y;   // z دەبێتە 30 (ژمارە)","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"},{"t":"Adding Strings – لکاندنی دەقەکان","p":"PDF P.55","c":"string x = \"10\";\nstring y = \"20\";\nstring z = x + y;   // z دەبێتە 1020 (دەق)","o":"(No output)\n-- Console.WriteLine بەکارنەهاتووە، بۆیە هیچ نیشان نادرێت"}];
const EX=[[["Math.Abs(23.7);","<code>Math.Abs(23.7)</code> بەهای ڕەهای 23.7 دەدۆزێتەوە واتە 23.7، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Abs(0.0);","<code>Math.Abs(0.0)</code> بەهای ڕەهای 0.0 دەدۆزێتەوە واتە 0.0، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Abs(-23.7);","<code>Math.Abs(-23.7)</code> بەهای ڕەهای -23.7 دەدۆزێتەوە و نیشانەی - لادەبات واتە 23.7، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Abs(23.7));</code> (دەرەنجام 23.7)."]],[["Math.Ceiling(9.2);","<code>Math.Ceiling(9.2)</code> 9.2 بۆ نزیکترین ژمارەی تەواوی گەورەتر بەرز دەکاتەوە واتە 10.0، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Ceiling(-9.8);","<code>Math.Ceiling(-9.8)</code> -9.8 بۆ نزیکترین ژمارەی تەواوی گەورەتر بەرز دەکاتەوە (لای سفر) واتە -9.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Ceiling(9.2));</code> (دەرەنجام 10.0)."]],[["Math.Cos(0.0);","<code>Math.Cos(0.0)</code> کۆسینۆسی 0.0 ڕادیان دەدۆزێتەوە واتە 1.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Cos(0.0));</code> (دەرەنجام 1.0)."]],[["Math.Exp(1.0);","<code>Math.Exp(1.0)</code> e بە توانی 1.0 دەدۆزێتەوە واتە نزیکەی 2.71828، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Exp(2.0);","<code>Math.Exp(2.0)</code> e بە توانی 2.0 دەدۆزێتەوە واتە نزیکەی 7.38906، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Exp(1.0));</code> (دەرەنجام نزیکەی 2.71828)."]],[["Math.Floor(9.2);","<code>Math.Floor(9.2)</code> 9.2 بۆ نزیکترین ژمارەی تەواوی بچووکتر نزم دەکاتەوە واتە 9.0، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Floor(-9.8);","<code>Math.Floor(-9.8)</code> -9.8 بۆ نزیکترین ژمارەی تەواوی بچووکتر نزم دەکاتەوە (دوور لە سفر) واتە -10.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Floor(9.2));</code> (دەرەنجام 9.0)."]],[["Math.Log(Math.E);","<code>Math.Log(Math.E)</code> لۆگارتمی سروشتی Math.E (نرخی e) دەدۆزێتەوە واتە 1.0، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Log(Math.E * Math.E);","<code>Math.Log(Math.E * Math.E)</code> لۆگارتمی سروشتی Math.E * Math.E (e لێکدراو لە e) دەدۆزێتەوە واتە 2.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Log(Math.E));</code> (دەرەنجام 1.0)."]],[["Math.Max(2.3, 12.7);","<code>Math.Max(2.3, 12.7)</code> 2.3 و 12.7 بەراورد دەکات و گەورەتریان دەدات واتە 12.7، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Max(-2.3, -12.7);","<code>Math.Max(-2.3, -12.7)</code> -2.3 و -12.7 بەراورد دەکات و گەورەتریان دەدات (-2.3 گەورەترە) واتە -2.3، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Max(2.3, 12.7));</code> (دەرەنجام 12.7)."]],[["Math.Min(2.3, 12.7);","<code>Math.Min(2.3, 12.7)</code> 2.3 و 12.7 بەراورد دەکات و بچووکتریان دەدات واتە 2.3، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Min(-2.3, -12.7);","<code>Math.Min(-2.3, -12.7)</code> -2.3 و -12.7 بەراورد دەکات و بچووکتریان دەدات (-12.7 بچووکترە) واتە -12.7، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Min(2.3, 12.7));</code> (دەرەنجام 2.3)."]],[["Math.Pow(2.0, 7.0);","<code>Math.Pow(2.0, 7.0)</code> 2.0 بە توانی 7.0 (2 جار 7) دەدۆزێتەوە واتە 128.0، بەڵام ئەنجامەکە چاپ ناکرێت."],["Math.Pow(9.0, 0.5);","<code>Math.Pow(9.0, 0.5)</code> 9.0 بە توانی 0.5 دەدۆزێتەوە، کە هاوشێوەی ڕەگی دووجای 9.0ـە واتە 3.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Pow(2.0, 7.0));</code> (دەرەنجام 128.0)."]],[["Math.Sin(0.0);","<code>Math.Sin(0.0)</code> ساینی 0.0 ڕادیان دەدۆزێتەوە واتە 0.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Sin(0.0));</code> (دەرەنجام 0.0)."]],[["Math.Sqrt(900.0);","<code>Math.Sqrt(900.0)</code> ڕەگی دووجای 900.0 دەدۆزێتەوە (30 × 30 = 900) واتە 30.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Sqrt(900.0));</code> (دەرەنجام 30.0)."]],[["Math.Tan(0.0);","<code>Math.Tan(0.0)</code> تانجێنتی 0.0 ڕادیان دەدۆزێتەوە واتە 0.0، بەڵام ئەنجامەکە چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Tan(0.0));</code> (دەرەنجام 0.0)."]],[["Console.WriteLine(Math.Max(5, 10));","<code>Math.Max(5, 10)</code> ژمارەکانی 5 و 10 بەراورد دەکات و گەورەترینیان واتە 10 دەگەڕێنێتەوە، پاشان <code>Console.WriteLine</code> ئەو 10ـە چاپ دەکات."]],[["Math.Min(5, 10);","<code>Math.Min(5, 10)</code> ژمارەکانی 5 و 10 بەراورد دەکات و کەمترینیان واتە 5 دەدۆزێتەوە، بەڵام ئەنجامەکە لە هیچ شوێنێک نانووسرێت و چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Min(5, 10));</code> (دەرەنجام 5)."]],[["Math.Sqrt(64);","<code>Math.Sqrt(64)</code> ڕەگی دووجای 64 دەدۆزێتەوە واتە 8 (چونکە 8 × 8 = 64)، بەڵام ئەنجامەکە لە هیچ شوێنێک نانووسرێت و چاپ ناکرێت."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە. بۆ بینینی ئەنجامەکە بنووسە <code>Console.WriteLine(Math.Sqrt(64));</code> (دەرەنجام 8)."]],[["static void MyMethod()","<code>static</code> واتە میسۆدەکە بەبێ دروستکردنی ئۆبجێکت بانگ دەکرێت، <code>void</code> واتە هیچ بەهایەک ناگەڕێنێتەوە، <code>MyMethod</code> ناوی میسۆدەکەیە و <code>()</code> واتە هیچ پارامیتەرێکی نییە."],[null,"⚠️ ئەم کۆدە تەنها میسۆدەکە دروست دەکات و هیچ نیشان نادات، چونکە هێشتا بانگ نەکراوە و بلۆکەکەشی بەتاڵە."]],[["static void MyMethod()","میسۆدێک دروست دەکات بە ناوی <code>MyMethod</code> کە هیچ بەهایەک ناگەڕێنێتەوە (<code>void</code>)."],["Console.WriteLine(\"I just got executed!\");","ئەم هێڵە لە ناو میسۆدەکەیە و دەقی I just got executed! چاپ دەکات، بەڵام تەنها کاتێک جێبەجێ دەبێت میسۆدەکە بانگ بکرێت."],["MyMethod();","<code>MyMethod();</code> میسۆدەکە بانگ دەکات، بۆیە کۆدی ناو بلۆکەکەی ئێستا جێبەجێ دەبێت و I just got executed! چاپ دەکات."]],[["static void MyMethod()","میسۆدێک دروست دەکات بە ناوی <code>MyMethod</code> بەبێ پارامیتەر و بەبێ گەڕاندنەوەی بەها."],["Console.WriteLine(\"I just got executed!\");","لە هەر بانگکردنێکدا دەقی I just got executed! چاپ دەکات."],["MyMethod();","بانگکردنی یەکەم: I just got executed! چاپ دەکرێت."],["MyMethod();","بانگکردنی دووەم: هەمان دەق جارێکی تر چاپ دەکرێت."],["MyMethod();","بانگکردنی سێیەم: هەمان دەق جارێکی تر چاپ دەکرێت، بۆیە سێ جار دەبینین."]],[["static void MyMethod(string fname)","میسۆدێک دروست دەکات کە پارامیتەرێکی هەیە بە ناوی <code>fname</code> لە جۆری <code>string</code> (دەق). لە کاتی بانگکردندا بەهایەکی دەق وەردەگرێت."],["Console.WriteLine(fname + \" Refsnes\");","بەهای fname لەگەڵ دەقی Refsnes (بە بۆشاییەکەوە) دەلکێنێت و چاپی دەکات."],["MyMethod(\"Liam\");","دەقی Liam دەخاتە ناو fname، بۆیە Liam Refsnes چاپ دەکرێت."],["MyMethod(\"Jenny\");","دەقی Jenny دەخاتە ناو fname، بۆیە Jenny Refsnes چاپ دەکرێت."],["MyMethod(\"Anja\");","دەقی Anja دەخاتە ناو fname، بۆیە Anja Refsnes چاپ دەکرێت."]],[["static void MyMethod(string fname, int age)","میسۆدێک دروست دەکات کە دوو پارامیتەری هەیە: <code>fname</code> لە جۆری <code>string</code> (دەق) و <code>age</code> لە جۆری <code>int</code> (ژمارەی تەواو)، بە کۆما جیا کراونەتەوە."],["Console.WriteLine(fname + \" is \" + age);","بەهای fname و دەقی is و بەهای age دەلکێنێت و چاپیان دەکات."],["MyMethod(\"Liam\", 5);","Liam دەخاتە ناو fname و 5 دەخاتە ناو age، بۆیە Liam is 5 چاپ دەکرێت."],["MyMethod(\"Jenny\", 8);","Jenny دەخاتە ناو fname و 8 دەخاتە ناو age، بۆیە Jenny is 8 چاپ دەکرێت."],["MyMethod(\"Anja\", 31);","Anja دەخاتە ناو fname و 31 دەخاتە ناو age، بۆیە Anja is 31 چاپ دەکرێت."]],[["static int MyMethod(int x)","میسۆدێک دروست دەکات کە بەهایەکی <code>int</code> دەگەڕێنێتەوە (لەبری <code>void</code>) و پارامیتەرێکی هەیە بە ناوی <code>x</code> لە جۆری <code>int</code>."],["return 5 + x;","<code>return</code> ئەنجامی 5 + x دەگەڕێنێتەوە بۆ ئەو شوێنەی میسۆدەکە لێوە بانگ کراوە."],["Console.WriteLine(MyMethod(3));","3 دەخاتە ناو x، میسۆدەکە 5 + 3 واتە 8 دەگەڕێنێتەوە و <code>Console.WriteLine</code> 8 چاپ دەکات."]],[["static int MyMethod(int x, int y)","میسۆدێک دروست دەکات کە <code>int</code> دەگەڕێنێتەوە و دوو پارامیتەری <code>x</code> و <code>y</code> (هەردووکیان ژمارەی تەواو)ی هەیە."],["return x + y;","<code>return</code> کۆی x و y دەگەڕێنێتەوە."],["Console.WriteLine(MyMethod(5, 3));","5 دەخاتە ناو x و 3 دەخاتە ناو y، میسۆدەکە 5 + 3 واتە 8 دەگەڕێنێتەوە و <code>Console.WriteLine</code> 8 چاپ دەکات."]],[["static int MyMethod(int x, int y)","میسۆدێک دروست دەکات کە <code>int</code> دەگەڕێنێتەوە و دوو پارامیتەری <code>x</code> و <code>y</code>ی هەیە."],["return x + y;","<code>return</code> کۆی x و y دەگەڕێنێتەوە."],["int z = MyMethod(5, 3);","گۆڕاوی <code>z</code> دروست دەکات لە جۆری <code>int</code>. میسۆدەکە بانگ دەکات بە 5 و 3، 5 + 3 واتە 8 دەگەڕێتەوە و دەخرێتە ناو z."],["Console.WriteLine(z);","<code>Console.WriteLine</code> بەهای z چاپ دەکات، بۆیە 8 دەبینین."]],[["string[] cars;","گۆڕاوێک بە ناوی <code>cars</code> ڕادەگەیەنێت لە جۆری <code>string[]</code> (ئارەی دەق). هێشتا ئارەیەک دروست نەکراوە و هیچ بەهایەکی تێدا نییە، بۆیە بەهاکەی null ـە."],[null,"⚠️ ئەم کۆدە هیچ نیشان نادات چونکە <code>Console.WriteLine</code> نییە، و ئارەکە هێشتا بەهای نەدراوەتێ."]],[["string[] cars = {\"Volvo\", \"BMW\", \"Ford\", \ n Doe."],["Console.WriteLine(name);","<code>Console.WriteLine</code> بەهای name چاپ دەکات، بۆیە John Doe دەبینین."]],[["string myString = \"Hello\";","گۆڕاوی <code>myString</code> دروست دەکات لە جۆری <code>string</code> و دەقی Helloی دەداتێ: H (ژمارە 0)، e (1)، l (2)، l (3)، o (4)."],["Console.WriteLine(myString[0]);","<code>myString[0]</code> پیتی ژمارە 0 واتە یەکەم پیت دەگەڕێنێتەوە و <code>Console.WriteLine</code> H چاپ دەکات."]],[["string myString = \"Hello\";","گۆڕاوی <code>myString</code> دروست دەکات لە جۆری <code>string</code> و دەقی Helloی دەداتێ."],["Console.WriteLine(myString[1]);","<code>myString[1]</code> پیتی ژمارە 1 واتە دووەم پیت دەگەڕێنێتەوە، بۆیە e چاپ دەکرێت."]],[["string myString = \"Hello\";","گۆڕاوی <code>myString</code> دروست دەکات لە جۆری <code>string</code> و دەقی Helloی دەداتێ."],["Console.WriteLine(myString.IndexOf(\"e\"));","<code>IndexOf(\"e\")</code> شوێنی یەکەم e دەدۆزێتەوە؛ e لە شوێنی ژمارە 1ـە، بۆیە 1 چاپ دەکرێت."]],[["string name = \"Waleed Kareem\";","گۆڕاوی <code>name</code> دروست دەکات لە جۆری <code>string</code> و دەقی Waleed Kareemی دەداتێ."],["int charPos = name.IndexOf(\"K\");","گۆڕاوی <code>charPos</code> دروست دەکات لە جۆری <code>int</code>. <code>IndexOf(\"K\")</code> شوێنی K دەدۆزێتەوە: Waleed شەش پیتە (0 تا 5)، بۆشاییە لە 6ـە، K لە 7ـە، بۆیە charPos = 7."],["string lastName = name.Substring(charPos);","گۆڕاوی <code>lastName</code> دروست دەکات لە جۆری <code>string</code>. <code>Substring(7)</code> دەقەکە لە شوێنی ژمارە 7ـەوە تا کۆتایی دەبڕێت واتە Kareem."],["Console.WriteLine(lastName);","<code>Console.WriteLine</code> بەهای lastName چاپ دەکات، بۆیە Kareem دەبینین."]],[["string txt = \"We are the so-called \"Vikings\" from the north.\";","C# دەقەکە لە یەکەم <code>\"</code> دەست پێدەکات و لە دووەم <code>\"</code> (پێش Vikings) کۆتایی پێدێنێت، بۆیە دەقەکە تەنها We are the so-called دەبێت. Vikings نەناسراوە و هەڵە دروست دەکات."],[null,"⚠️ چارەسەر: پێش هەر <code>\"</code>ێکی ناو دەقەکە <code>\\</code> دابنێ (نموونەی داهاتوو)."] Line(r);","<code>Console.WriteLine</code> بەهای r چاپ دەکات، بۆیە 0 دەبینین (C# بۆ ژمارەی کەسری کە تەواوە .0 نانووسێت).",[]]],"sum":"پوختە: <code>Math.Tan</code> تانجێنتـی ژمارەکان دەگەڕێنێتەوە و دەکرێت لە گۆڕاوێکدا هەڵبگیرێت."},{"c":"int a = 12;\nint b = 7;\nint big = Math.Max(a, b);\nConsole.WriteLine(big);","o":"12","intro":"سەرەتا گۆڕاوی <code>a</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 12ـمان پێدا، و گۆڕاوی <code>b</code>ی دووەممان دروست کرد و بەهای 7ـمان پێدا. دواتر <code>big</code>مان دروست کرد و بە <code>Math.Max</code> گەورەترینی a و b واتە 12ـمان تێدا دانا. لە کۆتاییدا بە <code>Console.WriteLine</code> بەهای big چاپ دەکەین: 12.","s":[["int a = 12;","گۆڕاوی <code>a</code> دروست دەکات لە جۆری <code>int</code> (ژمارەی تەواو) و بەهای 12ی دەداتێ.",["a = 12"]],["int b = 7;","گۆڕاوی دووەم <code>b</code> دروست دەکات لە جۆری <code>int</code> و بەهای 7ی دەداتێ. ئێستا a = 12 و b = 7.",["a = 12","b = 7"]],["int big = Math.Max(a, b);","گۆڕاوی <code>big</code> دروست دەکات لە جۆری <code>int</code>. <code>Math.Max</code> بەهای a (12) و b (7) بەراورد دەکات، گەورەترینیان واتە 12 دەگەڕێنێتەوە و دەیخاتە ناو big.",["big = 12"]],["Console.WriteLine(big);","<code>Console.WriteLine</code> بەهای big چاپ دەکات، بۆیە 12 دەبینین.",[]]],"sum":"پوختە: <code>Math.Max</code> گەورەترین بەها دەگەڕێنێتەوە و دەکرێت لە گۆڕاوێکدا هەڵبگیرێت."},{"c":"int x = 20;\nint y = 30;\nint small = Math.Min(x, y);\nConsole.WriteLine(small);","o":"20","intro":"سەرەتا گۆڕاوی <code>x</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 20ـمان پێدا، و گۆڕاوی <code>y</code>ی دووەممان دروست کرد و بەهای 30ـمان پێدا. دواتر <code>small</code>مان دروست کرد و بە <code>Math.Min</code> کەمترینی x و y واتە 20ـمان تێدا دانا. لە کۆتاییدا بە <code>Console.WriteLine</code> بەهای small چاپ دەکەین: 20.","s":[["int x = 20;","گۆڕاوی <code>x</code> دروست دەکات لە جۆری <code>int</code> (ژمارەی تەواو) و بەهای 20ی دەداتێ.",["x = 20"]],["int y = 30;","گۆڕاوی دووەم <code>y</code> دروست دەکات لە جۆری <code>int</code> و بەهای 30ی دەداتێ. ئێستا x = 20 و y = 30.",["x = 20","y = 30"]],["int small = Math.Min(x, y);","گۆڕاوی <code>small</code> دروست دەکات لە جۆری <code>int</code>. <code>Math.Min</code> بەهای x (20) و y (30) بەراورد دەکات، کەمترینیان واتە 20 دەگەڕێنێتەوە و دەیخاتە ناو small.",["small = 20"]],["Console.WriteLine(small);","<code>Console.WriteLine</code> بەهای small چاپ دەکات، بۆیە 20 دەبینین.",[]]],"sum":"پوختە: <code>Math.Min</code> کەمترین بەها دەگەڕێنێتەوە و دەکرێت لە گۆڕاوێکدا هەڵبگیرێت."},{"c":"int n = 81;\ndouble r = Math.Sqrt(n);\nConsole.WriteLine(r);","o":"9","intro":"سەرەتا گۆڕاوی <code>n</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 81ـمان پێدا. دواتر <code>r</code>مان دروست کرد بە جۆری <code>double</code> (ژمارەی کەسری) و بە <code>Math.Sqrt</code> ڕەگی دووجای n واتە 9ـمان تێدا دانا. لە کۆتاییدا بە <code>Console.WriteLine</code> بەهای r چاپ دەکەین: 9.","s":[["int n = 81;","گۆڕاوی <code>n</code> دروست دەکات لە جۆری <code>int</code> (ژمارەی تەواو) و بەهای 81ی دەداتێ.",["n = 81"]],["double r = Math.Sqrt(n);","گۆڕاوی <code>r</code> دروست دەکات لە جۆری <code>double</code> (ژمارەی کەسری)، چونکە <code>Math.Sqrt</code> ژمارەی کەسری دەگەڕێنێتەوە. ڕەگی دووجای 81 دەدۆزێتەوە واتە 9 (9 × 9 = 81) و دەیخاتە ناو r.",["r = 9"]],["Console.WriteLine(r);","<code>Console.WriteLine</code> بەهای r چاپ دەکات، بۆیە 9 دەبینین.",[]]],"sum":"پوختە: <code>Math.Sqrt</code> ڕەگی دووجا دەگەڕێنێتەوە لە جۆری double."},{"c":"static void Hello()\n{\n  Console.WriteLine(\"Hi\");\n}","o":"(No output)\n-- میسۆدەکە بانگ نەکراوە","intro":"سەرەتا میسۆدێکمان دروست کرد بە ناوی <code>Hello</code> کە هیچ بەهایەک ناگەڕێنێتەوە (<code>void</code>) و هیچ پارامیتەرێکی نییە. لە ناو بلۆکەکەی <code>Console.WriteLine</code>ی دانا بۆ چاپکردنی Hi. بەڵام میسۆدەکە بانگ نەکراوە، بۆیە Hi چاپ ناکرێت و هیچ نابینین.","s":[["static void Hello()","میسۆدێک دروست دەکات بە ناوی <code>Hello</code>. <code>void</code> واتە هیچ بەهایەک ناگەڕێنێتەوە و <code>()</code> واتە پارامیتەری نییە.",[]],["Console.WriteLine(\"Hi\");","ئەگەر میسۆدەکە بانگ بکرێت، <code>Console.WriteLine</code> دەقی Hi چاپ دەکات. هێشتا بانگ نەکراوە، بۆیە ئێستا چاپ ناکرێت.",[]]],"sum":"پوختە: دروستکردنی میسۆد و بانگکردنی دوو شتی جیاوازن؛ بەبێ بانگکردن کۆدی ناو میسۆدەکە جێبەجێ نابێت."},{"c":"static void Greet()\n{\n  Console.WriteLine(\"Welcome\");\n}\nGreet();","o":"Welcome","intro":"سەرەتا میسۆدێکمان دروست کرد بە ناوی <code>Greet</code> کە لە ناویدا <code>Console.WriteLine</code> دەقی Welcome چاپ دەکات. دواتر بە <code>Greet();</code> بانگمان کرد، بۆیە Welcome دەبینین.","s":[["static void Greet()","میسۆدێک دروست دەکات بە ناوی <code>Greet</code>، بەبێ پارامیتەر و بەبێ گەڕاندنەوەی بەها.",[]],["Console.WriteLine(\"Welcome\");","کۆدی ناو میسۆدەکەیە: دەقی Welcome چاپ دەکات کاتێک میسۆدەکە بانگ بکرێت.",[]],["Greet();","میسۆدی <code>Greet</code> بانگ دەکات، بۆیە Welcome چاپ دەکرێت.",[]]],"sum":"پوختە: بانگکردنی میسۆد (ناوەکەی + <code>()</code> + <code>;</code>) کۆدی ناو میسۆدەکە جێبەجێ دەکات."},{"c":"static void Line()\n{\n  Console.WriteLine(\"---\");\n}\nLine();\nConsole.WriteLine(\"Hi\");\nLine();","o":"---\nHi\n---","intro":"سەرەتا میسۆدێکمان دروست کرد بە ناوی <code>Line</code> کە دەقی --- چاپ دەکات. دواتر <code>Line();</code>مان بانگ کرد و --- چاپ بوو، پاشان <code>Console.WriteLine</code> دەقی Hi چاپ کرد، و دووبارە <code>Line();</code>مان بانگ کرد و --- چاپ بوو. بۆیە ---، Hi، --- دەبینین.","s":[["static void Line()","میسۆدێک دروست دەکات بە ناوی <code>Line</code>، بەبێ پارامیتەر و بەبێ گەڕاندنەوەی بەها.",[]],["Console.WriteLine(\"---\");","لە هەر بانگکردنێکدا دەقی --- چاپ دەکات.",[]],["Line();","بانگکردنی یەکەم: --- چاپ دەکرێت.",[]],["Console.WriteLine(\"Hi\");","<code>Console.WriteLine</code> دەقی Hi چاپ دەکات.",[]],["Line();","بانگکردنی دووەم: دووبارە --- چاپ دەکرێت.",[]]],"sum":"پوختە: میسۆد چەند جارێک بانگ دەکرێت و هەر جارێک کۆدەکەی جێبەجێ دەبێت."},{"c":"static void Hello(string name)\n{\n  Console.WriteLine(\"Hello \" + name);\n}\nHello(\"Sara\");\nHello(\"Ali\");","o":"Hello Sara\nHello Ali","intro":"سەرەتا میسۆدی <code>Hello</code>مان دروست کرد کە پارامیتەرێکی هەیە بە ناوی <code>name</code> لە جۆری <code>string</code>. لە ناو میسۆدەکە <code>Console.WriteLine</code> دەقی Hello لەگەڵ name دەلکێنێت. دواتر بە Sara و پاشان بە Ali بانگمان کرد، بۆیە Hello Sara و Hello Ali دەبینین.","s":[["static void Hello(string name)","میسۆدێک دروست دەکات بە ناوی <code>Hello</code> و پارامیتەرێکی دەقی هەیە بە ناوی <code>name</code>.",[]],["Console.WriteLine(\"Hello \" + name);","دەقی Hello (بە بۆشاییەکەوە) لەگەڵ بەهای name دەلکێنێت و چاپی دەکات.",[]],["Hello(\"Sara\");","دەقی Sara دەخاتە ناو name، بۆیە Hello Sara چاپ دەکرێت.",["name = \"Sara\""]],["Hello(\"Ali\");","دەقی Ali دەخاتە ناو name، بۆیە Hello Ali چاپ دەکرێت.",["name = \"Ali\""]]],"sum":"پوختە: پارامیتەر وەک گۆڕاوێکە لە ناو میسۆدەکە و بەهاکەی لە کاتی بانگکردندا دەدرێت."},{"c":"static void Info(string city, int temp)\n{\n  Console.WriteLine(city + \": \" + temp);\n}\nInfo(\"Paris\", 20);\nInfo(\"Rome\", 25);","o":"Paris: 20\nRome: 25","intro":"سەرەتا میسۆدی <code>Info</code>مان دروست کرد کە دوو پارامیتەری هەیە: <code>city</code> (دەق) و <code>temp</code> (ژمارەی تەواو). لە ناو میسۆدەکە <code>Console.WriteLine</code> ناوی شار و دەقی : و پلەی گەرمی دەلکێنێت. دواتر بە Paris و 20، پاشان بە Rome و 25 بانگمان کرد، بۆیە Paris: 20 و Rome: 25 دەبینین.","s":[["static void Info(string city, int temp)","میسۆدێک دروست دەکات بە دوو پارامیتەر: <code>city</code> (دەق) و <code>temp</code> (ژمارەی تەواو).",[]],["Console.WriteLine(city + \": \" + temp);","بەهای city و دەقی : و بەهای temp دەلکێنێت و چاپیان دەکات.",[]],["Info(\"Paris\", 20);","Paris دەخاتە ناو city و 20 دەخاتە ناو temp، بۆیە Paris: 20 چاپ دەکرێت.",["city = \"Paris\"","temp = 20"]],["Info(\"Rome\", 25);","Rome دەخاتە ناو city و 25 دەخاتە ناو temp، بۆیە Rome: 25 چاپ دەکرێت.",["city = \"Rome\"","temp = 25"]]],"sum":"پوختە: بەهاکان بە هەمان ڕیزبەندی پارامیتەرەکان دەدرێن."},{"c":"static int Twice(int x)\n{\n  return x * 2;\n}\nConsole.WriteLine(Twice(4));","o":"8","intro":"سەرەتا میسۆدی <code>Twice</code>مان دروست کرد کە جۆرەکەی <code>int</code>ـە و پارامیتەرێکی هەیە بە ناوی <code>x</code>. بە <code>return</code> ئەنجامی x * 2 دەگەڕێنێتەوە. دواتر بە 4 بانگمان کرد، بۆیە 4 * 2 واتە 8 دەگەڕێتەوە و <code>Console.WriteLine</code> چاپی دەکات.","s":[["static int Twice(int x)","میسۆدێک دروست دەکات بە ناوی <code>Twice</code> کە بەهایەکی <code>int</code> دەگەڕێنێتەوە و پارامیتەری <code>x</code> (ژمارەی تەواو)ی هەیە.",[]],["return x * 2;","<code>return</code> ئەنجامی x * 2 دەگەڕێنێتەوە بۆ شوێنی بانگکردنەکە.",[]],["Console.WriteLine(Twice(4));","4 دەخاتە ناو x، میسۆدەکە 4 * 2 واتە 8 دەگەڕێنێتەوە و <code>Console.WriteLine</code> 8 چاپ دەکات.",["x = 4"]]],"sum":"پوختە: <code>return</code> بەهایەک دەگەڕێنێتەوە و دەکرێت راستەوخۆ چاپ بکرێت."},{"c":"static int Mul(int a, int b)\n{\n  return a * b;\n}\nConsole.WriteLine(Mul(4, 6));","o":"24","intro":"سەرەتا میسۆدی <code>Mul</code>مان دروست کرد کە <code>int</code> دەگەڕێنێتەوە و دوو پارامیتەری هەیە: <code>a</code> و <code>b</code>. بە <code>return</code> لێکدانیان دەگەڕێنێتەوە. دواتر بە 4 و 6 بانگمان کرد، بۆیە 4 * 6 واتە 24 دەگەڕێتەوە و <code>Console.WriteLine</code> چاپی دەکات.","s":[["static int Mul(int a, int b)","میسۆدێک دروست دەکات بە ناوی <code>Mul</code> کە <code>int</code> دەگەڕێنێتەوە و دوو پارامیتەری <code>a</code> و <code>b</code>ی هەیە.",[]],["return a * b;","<code>return</code> ئەنجامی a * b دەگەڕێنێتەوە.",[]],["Console.WriteLine(Mul(4, 6));","4 دەخاتە ناو a و 6 دەخاتە ناو b، میسۆدەکە 4 * 6 واتە 24 دەگەڕێنێتەوە و <code>Console.WriteLine</code> 24 چاپ دەکات.",["a = 4","b = 6"]]],"sum":"پوختە: میسۆد دەتوانێت چەند پارامیتەرێک وەربگرێت و یەک بەها بگەڕێنێتەوە."},{"c":"static int Sub(int a, int b)\n{\n  return a - b;\n}\nint r = Sub(10, 4);\nConsole.WriteLine(r);","o":"6","intro":"سەرەتا میسۆدی <code>Sub</code>مان دروست کرد کە <code>int</code> دەگەڕێنێتەوە و بە <code>return</code> جیاوازی a و b دەگەڕێنێتەوە. دواتر گۆڕاوی <code>r</code>مان دروست کرد و ئەنجامی <code>Sub(10, 4)</code> واتە 6ـمان تێدا هەڵگرت. لە کۆتاییدا <code>Console.WriteLine</code> بەهای r چاپ دەکات: 6.","s":[["static int Sub(int a, int b)","میسۆدێک دروست دەکات بە ناوی <code>Sub</code> کە <code>int</code> دەگەڕێنێتەوە و دوو پارامیتەری <code>a</code> و <code>b</code>ی هەیە.",[]],["return a - b;","<code>return</code> ئەنجامی a - b دەگەڕێنێتەوە.",[]],["int r = Sub(10, 4);","گۆڕاوی <code>r</code> دروست دەکات لە جۆری <code>int</code>. 10 دەخاتە ناو a و 4 دەخاتە ناو b، 10 - 4 واتە 6 دەگەڕێتەوە و دەخرێتە ناو r.",["r = 6"]],["Console.WriteLine(r);","<code>Console.WriteLine</code> بەهای r چاپ دەکات، بۆیە 6 دەبینین.",[]]],"sum":"پوختە: ئەنجامی میسۆد دەکرێت لە گۆڕاوێکدا هەڵبگیرێت و دواتر بەکاربهێنرێت."},{"c":"int[] nums;\nnums = new int[] {4, 8};\nConsole.WriteLine(nums[1]);","o":"8","intro":"سەرەتا گۆڕاوی <code>nums</code>مان ڕاگەیاند بە جۆری <code>int[]</code> (ئارەی ژمارەی تەواو)، هێشتا بەهای نییە. دواتر بە <code>new int[] {4, 8}</code> ئارەیەکمان دروست کرد کە 4 و 8ی تێدایە و خستمانە ناو nums. لە کۆتاییدا <code>Console.WriteLine</code> ئەندامی ژمارە 1 چاپ دەکات: 8.","s":[["int[] nums;","گۆڕاوی <code>nums</code> ڕادەگەیەنێت لە جۆری <code>int[]</code> (ئارەی ژمارەی تەواو)؛ هێشتا ئارەیەک دروست نەکراوە.",["nums = null"]],["nums = new int[] {4, 8};","ئارەیەکی نوێ دروست دەکات کە دوو ژمارەی تێدایە: 4 (ژمارە 0) و 8 (ژمارە 1)، و دەیخاتە ناو nums.",["nums = {4, 8}"]],["Console.WriteLine(nums[1]);","<code>nums[1]</code> ئەندامی ژمارە 1 دەگەڕێنێتەوە، بۆیە 8 چاپ دەکرێت.",[]]],"sum":"پوختە: ڕاگەیاندنی ئارە تەنها گۆڕاوەکە دروست دەکات؛ ئارەکە دواتر بە بەهاکان دروست دەکرێت."},{"c":"string[] pets = {\"Cat\", \"Dog\", \"Fish\"};\nConsole.WriteLine(pets[2]);","o":"Fish","intro":"سەرەتا ئارەی <code>pets</code>مان دروست کرد بە جۆری <code>string[]</code> و سێ دەقمان تێدا دانا: Cat (ژمارە 0)، Dog (1)، Fish (2). دواتر <code>Console.WriteLine</code> ئەندامی ژمارە 2 چاپ دەکات: Fish.","s":[["string[] pets = {\"Cat\", \"Dog\", \"Fish\"};","ئارەیەک بە ناوی <code>pets</code> دروست دەکات لە جۆری <code>string[]</code> و سێ دەقی تێدا دادەنێت: Cat (0)، Dog (1)، Fish (2).",["pets = {Cat, Dog, Fish}"]],["Console.WriteLine(pets[2]);","<code>pets[2]</code> ئەندامی ژمارە 2 واتە سێیەم ئەندام دەگەڕێنێتەوە، بۆیە Fish چاپ دەکرێت.",[]]],"sum":"پوختە: بەهاکان لە ناو <code>{ }</code> بە کۆما جیا دەکرێنەوە."},{"c":"int[] marks = {70, 85, 90};\nConsole.WriteLine(marks[1]);","o":"85","intro":"سەرەتا ئارەی <code>marks</code>مان دروست کرد بە جۆری <code>int[]</code> و سێ ژمارەمان تێدا دانا: 70 (ژمارە 0)، 85 (1)، 90 (2). دواتر <code>Console.WriteLine</code> ئەندامی ژمارە 1 چاپ دەکات: 85.","s":[["int[] marks = {70, 85, 90};","ئارەیەک بە ناوی <code>marks</code> دروست دەکات لە جۆری <code>int[]</code> و سێ ژمارەی تێدا دادەنێت: 70 (0)، 85 (1)، 90 (2).",["marks = {70, 85, 90}"]],["Console.WriteLine(marks[1]);","<code>marks[1]</code> ئەندامی ژمارە 1 واتە دووەم ئەندام دەگەڕێنێتەوە، بۆیە 85 چاپ دەکرێت.",[]]],"sum":"پوختە: <code>int[]</code> ئارەی ژمارەی تەواوە."},{"c":"string[] fruits = {\"Apple\", \"Kiwi\", \"Lemon\"};\nConsole.WriteLine(fruits[2]);","o":"Lemon","intro":"سەرەتا ئارەی <code>fruits</code>مان دروست کرد کە سێ ناوی تێدایە: Apple (ژمارە 0)، Kiwi (1)، Lemon (2). دواتر بە <code>fruits[2]</code> ئەندامی ژمارە 2مان خوێندەوە، بۆیە <code>Console.WriteLine</code> Lemon چاپ دەکات.","s":[["string[] fruits = {\"Apple\", \"Kiwi\", \"Lemon\"};","ئارەیەک بە ناوی <code>fruits</code> دروست دەکات لە جۆری <code>string[]</code> و سێ ئەندامی تێدا دادەنێت: Apple (0)، Kiwi (1)، Lemon (2).",["fruits = {Apple, Kiwi, Lemon}"]],["Console.WriteLine(fruits[2]);","<code>fruits[2]</code> ئەندامی ژمارە 2 واتە سێیەم ئەندام دەگەڕێنێتەوە، بۆیە Lemon چاپ دەکرێت.",[]]],"sum":"پوختە: ژمارەی ئەندامەکان لە 0ـەوە دەست پێدەکەن، بۆیە ژمارە 2 سێیەم ئەندامە."},{"c":"int[] nums = {10, 20, 30};\nnums[1] = 99;\nConsole.WriteLine(nums[1]);","o":"99","intro":"سەرەتا ئارەی <code>nums</code>مان دروست کرد بە سێ ژمارەی تەواو: 10 و 20 و 30. دواتر بە <code>nums[1] = 99;</code> ئەندامی ژمارە 1 واتە 20مان گۆڕی بە 99. لە کۆتاییدا <code>Console.WriteLine</code> بەهای nums[1] چاپ دەکات: 99.","s":[["int[] nums = {10, 20, 30};","ئارەیەک بە ناوی <code>nums</code> دروست دەکات لە جۆری <code>int[]</code> (ئارەی ژمارەی تەواو) و سێ ئەندامی تێدا دادەنێت.",["nums = {10, 20, 30}"]],["nums[1] = 99;","ئەندامی ژمارە 1 (بەهای 20) دەگۆڕێت بە 99.",["nums = {10, 99, 30}"]],["Console.WriteLine(nums[1]);","<code>Console.WriteLine</code> بەهای nums[1] چاپ دەکات، چونکە گۆڕدرا بە 99، ئەوە دەبینین نەک 20.",[]]],"sum":"پوختە: بە ژمارەی ئەندام (index) بەهای ئەو ئەندامە دەگۆڕدرێت."},{"c":"string[] names = {\"Ali\", \"Sara\"};\nnames[1] = \"Dara\";\nConsole.WriteLine(names[1]);","o":"Dara","intro":"سەرەتا ئارەی <code>names</code>مان دروست کرد بە دوو ناو: Ali و Sara. دواتر بە <code>names[1] = \"Dara\";</code> ئەندامی ژمارە 1 واتە Saraمان گۆڕی بە Dara. لە کۆتاییدا <code>Console.WriteLine</code> بەهای names[1] چاپ دەکات: Dara.","s":[["string[] names = {\"Ali\", \"Sara\"};","ئارەیەک بە ناوی <code>names</code> دروست دەکات لە جۆری <code>string[]</code> و دوو ئەندامی تێدا دادەنێت: Ali (0) و Sara (1).",["names = {Ali, Sara}"]],["names[1] = \"Dara\";","ئەندامی ژمارە 1 (Sara) دەگۆڕێت بە Dara.",["names = {Ali, Dara}"]],["Console.WriteLine(names[1]);","<code>Console.WriteLine</code> ئەندامی ژمارە 1 چاپ دەکات، بۆیە Dara دەبینین نەک Sara.",[]]],"sum":"پوختە: دوای گۆڕین، خوێندنەوەی هەمان ئەندام بەهای نوێ دەدات."},{"c":"int[] nums = {3, 6, 9};\nConsole.WriteLine(nums.Length);","o":"3","intro":"سەرەتا ئارەی <code>nums</code>مان دروست کرد کە سێ ژمارەی تێدایە: 3 و 6 و 9. دواتر بە <code>nums.Length</code> ژمارەی ئەندامەکانی ئارەکەمان زانی، کە 3ـە، بۆیە <code>Console.WriteLine</code> 3 چاپ دەکات.","s":[["int[] nums = {3, 6, 9};","ئارەیەک بە ناوی <code>nums</code> دروست دەکات لە جۆری <code>int[]</code> و سێ ئەندامی تێدا دادەنێت.",["nums = {3, 6, 9}"]],["Console.WriteLine(nums.Length);","<code>nums.Length</code> ژمارەی ئەندامەکان دەگەڕێنێتەوە، سێ ئەندامە، بۆیە 3 چاپ دەکرێت. Length ژمارەی ئەندامەکانە، نەک بەهای ئەندامێک.",[]]],"sum":"پوختە: <code>Length</code> ژمارەی ئەندامەکانی ئارەکە دەدات."},{"c":"int[] nums = {5, 10, 15};\nfor (int i = 0; i < nums.Length; i++)\n{\n  Console.WriteLine(nums[i]);\n}","o":"5\n10\n15","intro":"سەرەتا ئارەی <code>nums</code>مان دروست کرد کە سێ ژمارەی تێدایە: 5 و 10 و 15. دواتر بە <code>for</code> گۆڕاوی <code>i</code>مان دروست کرد و بەهای 0ـمان پێدا، و مەرجمان دانا تا i کەمتر بێت لە <code>nums.Length</code> واتە 3. لە ناو لووپەکە <code>Console.WriteLine</code> هەر جارێک ئەندامی ژمارە i چاپ دەکات، بۆیە 5 و 10 و 15 دەبینین.","s":[["int[] nums = {5, 10, 15};","ئارەیەک بە ناوی <code>nums</code> دروست دەکات لە جۆری <code>int[]</code> و سێ ئەندامی تێدا دادەنێت.",["nums = {5, 10, 15}"]],["for (int i = 0; i < nums.Length; i++)","گۆڕاوی <code>i</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ. تا <code>i &lt; nums.Length</code> (واتە i کەمتر بێت لە 3) بەردەوامە و هەر جارێک i یەک زیاد دەکات.",["i = 0 ، 1 ، 2"]],["Console.WriteLine(nums[i]);","لە هەر دووبارەبوونەوەیەکدا ئەندامی ژمارە i چاپ دەکات: nums[0] 5، nums[1] 10، nums[2] 15.",[]]],"sum":"پوختە: i وەک ژمارەی ئەندام بەکاردێت و Length دەزانێت لووپەکە چەند جار دووبارە ببێتەوە."},{"c":"int[] nums = {2, 4, 6};\nforeach (int x in nums)\n{\n  Console.WriteLine(x);\n}","o":"2\n4\n6","intro":"سەرەتا ئارەی <code>nums</code>مان دروست کرد کە سێ ژمارەی تێدایە: 2 و 4 و 6. دواتر بە <code>foreach</code> هەر ئەندامێکمان یەک بە یەک خستە ناو گۆڕاوی <code>x</code> کە جۆرەکەی <code>int</code>ـە. لە ناو لووپەکە <code>Console.WriteLine</code> هەر جارێک x چاپ دەکات، بۆیە 2 و 4 و 6 دەبینین.","s":[["int[] nums = {2, 4, 6};","ئارەیەک بە ناوی <code>nums</code> دروست دەکات لە جۆری <code>int[]</code> و سێ ئەندامی تێدا دادەنێت.",["nums = {2, 4, 6}"]],["foreach (int x in nums)","هەر ئەندامێکی nums یەک بە یەک دەخاتە ناو گۆڕاوی <code>x</code> لە جۆری <code>int</code>؛ جۆری x دەبێت هاوجۆری ئەندامەکان بێت.",["x = 2 ، 4 ، 6"]],["Console.WriteLine(x);","بەهای ئێستای x چاپ دەکات: 2 پاشان 4
